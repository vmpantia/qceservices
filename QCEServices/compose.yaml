services:
  qceservices.api:
    image: qceservices.api
    build:
      context: .
      dockerfile: QCEServices.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - qceservices.db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MigrationDb: >
        Server=qceservices.db;
        Database=QCEServices.DB;
        User Id=sa;
        Password=p@ssw0rd;
        Encrypt=True;
        TrustServerCertificate=True;


  qceservices.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "p@ssw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
        
volumes:
  sql_data:



  


