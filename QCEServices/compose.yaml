services:
  
  qceservices.web:
    image: qceservices.web
    build:
      context: .
      dockerfile: QCEServices.Web/Dockerfile
    ports:
      - "6000:8080"
  
  qceservices.api:
    image: qceservices.api
    build:
      context: .
      dockerfile: QCEServices.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      - qceservices.db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MigrationDb: >
        Server=qceservices.db;
        Database=QCEServices.DB;
        User Id=sa;
        Password=p@ssw0rd;
        Encrypt=True;
        TrustServerCertificate=True;

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "18080:8080"
    volumes:
      - ./containers/identity:/opt/keycloak/data
    user: root

  qceservices.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "p@ssw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
        
volumes:
  sql_data:

